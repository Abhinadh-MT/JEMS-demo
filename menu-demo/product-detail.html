<!doctype html>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#d4af37",
            "background-light": "#f5f5f5",
            "background-dark": "#121212",
            "card-light": "#ffffff",
            "card-dark": "#1e1e1e",
            "text-light": "#333333",
            "text-dark": "#e0e0e0",
            "border-light": "#e0e0e0",
            "border-dark": "#333333",

<body data-page="product-detail" class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark flex h-screen">
  <div class="flex min-h-screen w-full">
    <div id="menu-container"></div>

    <main class="flex-1 overflow-y-auto bg-background-light dark:bg-background-dark">
      <div class="p-8">
        <!-- Breadcrumb -->
        <div class="flex items-center gap-2 mb-8 text-sm text-text-light/70 dark:text-text-dark/70">
          <a class="hover:text-primary transition-colors" href="products.html">Catalogue</a>
          <span class="material-icons text-base">chevron_right</span>
          <a class="hover:text-primary transition-colors" href="products.html">Products</a>
          <span class="material-icons text-base">chevron_right</span>
          <span class="font-semibold text-text-light dark:text-text-dark" id="product-name-breadcrumb">Product Details</span>
        </div>

        <!-- Product Details Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
          <!-- Product Images -->
          <div class="flex flex-col gap-6">
            <!-- Main Image -->
            <div class="w-full bg-center bg-no-repeat aspect-square bg-cover rounded-xl border border-border-light/30 dark:border-border-dark/50 bg-card-light dark:bg-card-dark" id="main-product-image">
              <!-- Main image will be set dynamically -->
            </div>
            
            <!-- Thumbnail Images -->
            <div class="grid grid-cols-5 gap-4" id="thumbnail-images">
              <!-- Thumbnails will be dynamically generated -->
            </div>
          </div>

          <!-- Product Information -->
          <div class="flex flex-col gap-8">
            <!-- Title and Description -->
            <div>
              <h1 class="text-text-light dark:text-text-dark text-4xl lg:text-5xl font-black leading-tight tracking-[-0.033em]" id="product-title">Product Name</h1>
              <p class="text-text-light/70 dark:text-text-dark/70 text-base font-normal leading-normal mt-2" id="product-description">Product description will appear here.</p>
            </div>

            <!-- Tags -->
            <div class="flex gap-2" id="product-tags">
              <!-- Tags will be dynamically generated -->
            </div>

            <!-- Specifications -->
            <div class="border-t border-border-light/30 dark:border-border-dark/50 pt-6">
              <h2 class="text-text-light dark:text-text-dark text-xl font-bold leading-normal mb-4">Specifications</h2>
              <div class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm text-text-light dark:text-text-dark" id="product-specs">
                <!-- Specifications will be dynamically generated -->
              </div>
            </div>

            <!-- Inventory & Pricing -->
            <div class="border-t border-border-light/30 dark:border-border-dark/50 pt-6">
              <h2 class="text-text-light dark:text-text-dark text-xl font-bold leading-normal mb-4">Inventory & Pricing</h2>
              <div class="flex items-center gap-4 mb-4">
                <div class="flex items-center gap-2">
                  <span class="material-icons text-green-600 dark:text-green-400">check_circle</span>
                  <p class="text-text-light dark:text-text-dark font-semibold" id="stock-status">In Stock</p>
                </div>
                <p class="text-text-light/70 dark:text-text-dark/70" id="stock-quantity">(5 units available)</p>
              </div>
              <p class="text-3xl font-bold text-primary" id="product-price">$0.00</p>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-4 mt-4">
              <button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] flex-1 hover:opacity-90 transition-opacity" id="add-to-order-btn">
                <span class="truncate">Add to Order</span>
              </button>
              <button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 border border-primary text-primary text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/10 transition-colors duration-200">
                <span class="truncate">Edit Design</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

    // Get product ID from URL
    function getProductIdFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return parseInt(urlParams.get('id')) || 1;
    }

    // Load product data
    function loadProduct() {
      const productId = getProductIdFromUrl();
      const product = products[productId] || products[1];

      // Update breadcrumb
      document.getElementById('product-name-breadcrumb').textContent = product.name;

      // Update title
      document.getElementById('product-title').textContent = product.name;
      document.getElementById('product-description').textContent = product.description;

      // Update tags
      const tagsContainer = document.getElementById('product-tags');
      tagsContainer.innerHTML = `
        <span class="text-xs font-semibold px-3 py-1.5 bg-primary/20 dark:bg-primary/30 text-primary rounded-full">${product.goldType}</span>
        <span class="text-xs font-semibold px-3 py-1.5 bg-primary/20 dark:bg-primary/30 text-primary rounded-full">${product.purity}</span>
      `;

      // Update main image
      const mainImage = document.getElementById('main-product-image');
      mainImage.style.backgroundImage = `url("${product.image}")`;

      // Update thumbnails
      const thumbnailsContainer = document.getElementById('thumbnail-images');
      thumbnailsContainer.innerHTML = '';
      product.images.forEach((img, index) => {
        const thumbnail = document.createElement('div');
        thumbnail.className = `w-full bg-center bg-no-repeat aspect-square bg-cover rounded-lg border ${index === 0 ? 'border-2 border-primary' : 'border-border-light/30 dark:border-border-dark/50 opacity-70 hover:opacity-100 hover:border-primary'} transition-all duration-200 cursor-pointer`;
        thumbnail.style.backgroundImage = `url("${img}")`;
        thumbnail.addEventListener('click', function() {
          // Update main image
          mainImage.style.backgroundImage = `url("${img}")`;
          // Update active thumbnail
          thumbnailsContainer.querySelectorAll('div').forEach((t, i) => {
            if (i === index) {
              t.classList.add('border-2', 'border-primary', 'opacity-100');
              t.classList.remove('border-border-light/30', 'dark:border-border-dark/50', 'opacity-70');
            } else {
              t.classList.remove('border-2', 'border-primary', 'opacity-100');
              t.classList.add('border-border-light/30', 'dark:border-border-dark/50', 'opacity-70');
            }
          });
        });
        thumbnailsContainer.appendChild(thumbnail);
      });

      // Update specifications
      const specsContainer = document.getElementById('product-specs');
      let specsHtml = `
        <p><span class="font-semibold text-text-light/70 dark:text-text-dark/70">Product ID:</span> ${product.productId}</p>
        <p><span class="font-semibold text-text-light/70 dark:text-text-dark/70">Gold Weight:</span> ${product.goldWeight}</p>
      `;
      
      if (product.stone !== 'N/A') {
        specsHtml += `
          <p><span class="font-semibold text-text-light/70 dark:text-text-dark/70">${product.stone} Weight:</span> ${product.stoneWeight}</p>
        `;
        if (product.diamondClarity) {
          specsHtml += `
            <p><span class="font-semibold text-text-light/70 dark:text-text-dark/70">Diamond Clarity:</span> ${product.diamondClarity}</p>
            <p><span class="font-semibold text-text-light/70 dark:text-text-dark/70">Diamond Color:</span> ${product.diamondColor}</p>
          `;
        }
      } else {
        specsHtml += `<p><span class="font-semibold text-text-light/70 dark:text-text-dark/70">Stone:</span> N/A</p>`;
      }
      
      if (product.ringSize) {
        specsHtml += `<p><span class="font-semibold text-text-light/70 dark:text-text-dark/70">Ring Size:</span> ${product.ringSize}</p>`;
      }
      
      specsContainer.innerHTML = specsHtml;

      // Update inventory and pricing
      document.getElementById('stock-status').textContent = product.stock > 0 ? 'In Stock' : 'Out of Stock';
      document.getElementById('stock-quantity').textContent = `(${product.stock} units available)`;
      document.getElementById('product-price').textContent = `$${product.price.toLocaleString()}.00`;
    }

    // Add to Order button handler
    document.getElementById('add-to-order-btn').addEventListener('click', function() {
      const productId = getProductIdFromUrl();
      const product = products[productId] || products[1];
      alert(`Added "${product.name}" to order!`);
      // In real app, this would add to cart/order
    });

    // Initialize
    loadProduct();
