<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>JEMS Price Updater</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Sans:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c8a95f",
                        "primary-dark": "#b0851d", // Consolidating
                        "background-light": "#f8f7f6",
                        "background-dark": "#1e1b14",
                        "border-light": "#e0e0e0", // For menu
                        "border-dark": "#333333", // For menu
                        "slate-bg": "#F1F5F9", // Standard app bg
                    },
                    fontFamily: {
                        "display": ["Noto Serif", "serif"],
                        "sans": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans', sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        .font-display {
            font-family: 'Noto Serif', serif;
        }
    </style>
</head>

<body data-page="price-updater" class="bg-slate-bg dark:bg-stone-900 h-screen flex">

    <div class="flex min-h-screen w-full">

        <!-- 🔹 MENU BAR -->
        <div id="menu-container"></div>

        <!-- 🔹 MAIN CONTENT -->
        <main class="flex-1 flex items-center justify-center p-4 bg-slate-bg dark:bg-stone-900 overflow-y-auto">

            <!-- Modal Container -->
            <div class="relative flex flex-col w-full max-w-lg bg-white dark:bg-stone-800 rounded-xl shadow-2xl overflow-hidden">
                
                <!-- Header -->
                <div class="bg-primary p-4 text-center">
                    <h2 class="text-white font-bold text-lg uppercase tracking-wide">DAILY METAL RATES</h2>
                </div>

                <!-- Last Updated -->
                <div class="text-center mt-4">
                    <p class="text-[10px] items-center text-stone-400 uppercase tracking-widest font-medium">LAST UPDATED: 18 FEB 2026 10:43 AM</p>
                </div>

                <!-- Content -->
                <div class="p-6 space-y-6">

                    <!-- Gold (24K) -->
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-stone-900 dark:text-stone-100 font-bold text-base">Gold (24K)</h3>
                            <p class="text-stone-400 text-xs mt-0.5">Previous: ₹7500 / gram</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" value="7500" 
                                class="w-32 border border-stone-200 dark:border-stone-700 rounded-lg px-3 py-2 text-stone-900 dark:text-stone-100 font-bold text-center focus:outline-none focus:ring-1 focus:ring-primary dark:bg-stone-800">
                            <div class="relative">
                                <select class="appearance-none bg-transparent border border-stone-200 dark:border-stone-700 rounded-lg pl-3 pr-8 py-2 text-xs font-bold text-stone-600 dark:text-stone-400 focus:outline-none focus:ring-1 focus:ring-primary cursor-pointer dark:bg-stone-800">
                                    <option>AM Fix</option>
                                    <option>PM Fix</option>
                                </select>
                                <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-stone-400 text-sm pointer-events-none">expand_more</span>
                            </div>
                        </div>
                    </div>

                    <!-- Gold (22K) -->
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-stone-900 dark:text-stone-100 font-bold text-base">Gold (22K)</h3>
                            <p class="text-stone-400 text-xs mt-0.5">Previous: ₹6800 / gram</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" value="6800" 
                                class="w-32 border border-stone-200 dark:border-stone-700 rounded-lg px-3 py-2 text-stone-900 dark:text-stone-100 font-bold text-center focus:outline-none focus:ring-1 focus:ring-primary dark:bg-stone-800">
                            <div class="relative">
                                <select class="appearance-none bg-transparent border border-stone-200 dark:border-stone-700 rounded-lg pl-3 pr-8 py-2 text-xs font-bold text-stone-600 dark:text-stone-400 focus:outline-none focus:ring-1 focus:ring-primary cursor-pointer dark:bg-stone-800">
                                    <option>AM Fix</option>
                                    <option>PM Fix</option>
                                </select>
                                <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-stone-400 text-sm pointer-events-none">expand_more</span>
                            </div>
                        </div>
                    </div>

                    <!-- Gold (18K) -->
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-stone-900 dark:text-stone-100 font-bold text-base">Gold (18K)</h3>
                            <p class="text-stone-400 text-xs mt-0.5">Previous: ₹5600 / gram</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" value="5600" 
                                class="w-32 border border-stone-200 dark:border-stone-700 rounded-lg px-3 py-2 text-stone-900 dark:text-stone-100 font-bold text-center focus:outline-none focus:ring-1 focus:ring-primary dark:bg-stone-800">
                            <div class="relative">
                                <select class="appearance-none bg-transparent border border-stone-200 dark:border-stone-700 rounded-lg pl-3 pr-8 py-2 text-xs font-bold text-stone-600 dark:text-stone-400 focus:outline-none focus:ring-1 focus:ring-primary cursor-pointer dark:bg-stone-800">
                                    <option>AM Fix</option>
                                    <option>PM Fix</option>
                                </select>
                                <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-stone-400 text-sm pointer-events-none">expand_more</span>
                            </div>
                        </div>
                    </div>

                     <!-- Silver -->
                     <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-stone-900 dark:text-stone-100 font-bold text-base">Silver</h3>
                            <p class="text-stone-400 text-xs mt-0.5">Previous: ₹90 / gram</p>
                        </div>
                        <div class="flex items-center gap-2">
                           <input type="number" value="90" 
                                class="w-32 border border-stone-200 dark:border-stone-700 rounded-lg px-3 py-2 text-stone-900 dark:text-stone-100 font-bold text-center focus:outline-none focus:ring-1 focus:ring-primary dark:bg-stone-800">
                           <!-- Spacer to align with inputs above if needed, or just leave as is since no dropdown -->
                           <div class="w-[102px]"></div> <!-- Approximate width of dropdown + gap to keep input aligned left of dropdown column -->
                        </div>
                    </div>

                </div>

                <!-- Footer -->
                <div class="p-6 pt-2 flex gap-4">
                    <button class="flex-1 py-3 rounded-xl border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-300 font-bold text-xs uppercase tracking-wider hover:bg-stone-50 dark:hover:bg-stone-700 transition-colors">
                        CANCEL
                    </button>
                    <button class="flex-1 py-3 rounded-xl bg-primary text-white font-bold text-xs uppercase tracking-wider shadow-lg shadow-primary/20 hover:bg-primary-dark transition-colors">
                        UPDATE & APPLY
                    </button>
                </div>

            </div>

        </main>
    </div>

    <!-- MENU SCRIPT -->
    <script src="menu.js"></script>

</body>

</html>
