<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Order - JEMS</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#d4af37",
            "background-light": "#f5f5f5",
            "background-dark": "#121212",
            "card-light": "#ffffff",
            "card-dark": "#1e1e1e",
            "text-light": "#333333",
            "text-dark": "#e0e0e0",
            "border-light": "#e0e0e0",
            "border-dark": "#333333",
          },
          fontFamily: { display: ["Poppins", "sans-serif"] },
          borderRadius: { DEFAULT: "0.5rem" },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="order-view" class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark flex h-screen">
  <div class="flex min-h-screen w-full">
    <div id="menu-container"></div>

    <main class="flex-1 overflow-y-auto p-8 bg-background-light dark:bg-background-dark">
      <!-- Header -->
      <header class="mb-8">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-3xl font-bold text-text-light dark:text-text-dark">View Order</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1" id="order-id-display">Order Details</p>
          </div>
          <div class="flex items-center gap-4">
            <button type="button" id="back-btn" class="flex items-center gap-2 px-6 py-2 border border-border-light dark:border-border-dark rounded-lg hover:bg-background-light dark:hover:bg-background-dark transition-colors">
              <span class="material-icons">arrow_back</span>
              <span>Back</span>
            </button>
            <button type="button" id="delete-order-btn" class="flex items-center gap-2 px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
              <span class="material-icons">delete</span>
              <span>Delete Order</span>
            </button>
            <button type="button" id="edit-order-btn" class="flex items-center gap-2 px-6 py-2 bg-primary text-white rounded-lg hover:opacity-90 transition-opacity">
              <span class="material-icons">edit</span>
              <span>Edit Order</span>
            </button>
            <button type="button" id="save-order-btn" class="hidden flex items-center gap-2 px-6 py-2 bg-primary text-white rounded-lg hover:opacity-90 transition-opacity">
              <span class="material-icons">save</span>
              <span>Save Changes</span>
            </button>
            <button type="button" id="cancel-edit-btn" class="hidden flex items-center gap-2 px-6 py-2 border border-border-light dark:border-border-dark rounded-lg hover:bg-background-light dark:hover:bg-background-dark transition-colors">
              <span>Cancel</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Order Header Form -->
      <div class="bg-card-light dark:bg-card-dark p-6 rounded-lg shadow-sm mb-6">
        <h2 class="text-xl font-semibold mb-6">Order Information</h2>
        
        <form id="order-form" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Order Type -->
            <div>
              <label for="order-type" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                Order Type <span class="text-red-500">*</span>
              </label>
              <select id="order-type" name="orderType" required disabled
                      class="w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg bg-gray-100 dark:bg-gray-800 cursor-not-allowed">
                <option value="">Select Order Type</option>
                <option value="NEW_CUSTOMER">New Customer Order</option>
                <option value="REPAIR">Repair Order</option>
                <option value="COMPANY">Company Order</option>
              </select>
            </div>

            <!-- Customer Name -->
            <div>
              <label for="customer-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                Customer Name <span class="text-red-500">*</span>
              </label>
              <input type="text" id="customer-name" name="customerName" required disabled
                     class="w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg bg-gray-100 dark:bg-gray-800 cursor-not-allowed"
                     placeholder="Customer name...">
            </div>

            <!-- Expected Delivery Date -->
            <div>
              <label for="delivery-date" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                Expected Delivery Date
              </label>
              <input type="date" id="delivery-date" name="deliveryDate" disabled
                     class="w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg bg-gray-100 dark:bg-gray-800 cursor-not-allowed">
            </div>

            <!-- Order No -->
            <div>
              <label for="order-no" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                Order No.
              </label>
              <input type="text" id="order-no" name="orderNo" readonly
                     class="w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg bg-gray-100 dark:bg-gray-800 cursor-not-allowed">
            </div>
          </div>
        </form>
      </div>

      <!-- Item Entry Panel -->
      <div class="bg-card-light dark:bg-card-dark p-6 rounded-lg shadow-sm mb-6">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-semibold text-text-light dark:text-text-dark">Item Entry Panel</h2>
          <button type="button" id="add-item-btn" class="hidden flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg hover:opacity-90 transition-opacity text-sm">
            <span class="material-icons text-base">add</span>
            <span>Add Item</span>
          </button>
        </div>

        <div id="items-container" class="space-y-6">
          <!-- Dynamic items will be added here -->
        </div>
      </div>

      <!-- Order Summary -->
      <div class="bg-card-light dark:bg-card-dark p-6 rounded-lg shadow-sm mb-6">
        <h2 class="text-xl font-semibold mb-4 text-text-light dark:text-text-dark">Order Summary</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left border-collapse">
            <thead class="text-xs text-gray-500 dark:text-gray-400 uppercase bg-background-light dark:bg-background-dark border-b-2 border-border-light dark:border-border-dark">
              <tr>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark" scope="col">SI No</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark" scope="col">Item Name</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark" scope="col">Type / Category / Size</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark" scope="col">Carat Weight</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark" scope="col">Count</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark" scope="col">Colour</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark text-right" scope="col">Rate</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark text-right" scope="col">Total Price</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark text-center" scope="col">Quantity</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark text-right" scope="col">Total Cost</th>
                <th class="px-3 py-3 border border-border-light dark:border-border-dark text-center" scope="col">Action</th>
              </tr>
            </thead>
            <tbody id="order-summary-body">
              <!-- Dynamic rows will be added here -->
            </tbody>
          </table>
          <div id="empty-summary-state" class="text-center py-12 text-gray-500 dark:text-gray-400">
            <span class="material-icons text-4xl mb-2">shopping_cart</span>
            <p>No items in this order.</p>
          </div>
        </div>
        <div class="mt-4 flex justify-end">
          <div class="w-full max-w-sm rounded-lg bg-primary/10 dark:bg-primary/20 p-4 border border-primary/30">
            <div class="flex items-center justify-between">
              <p class="text-sm font-semibold text-primary">Total Order Value</p>
              <p class="text-2xl font-bold text-text-light dark:text-text-dark" id="total-order-value">$0.00</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="menu.js"></script>
  <script>
    let currentOrder = null;
    let isEditMode = false;
    let itemCounter = 0;
    let originalOrderData = null;

    // Get order ID from URL
    function getOrderIdFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('orderId');
    }

    // Load order data
    function loadOrder() {
      const orderId = getOrderIdFromURL();
      if (!orderId) {
        alert('Order ID not found. Redirecting to order report...');
        window.location.href = 'order-report.html';
        return;
      }

      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      currentOrder = orders.find(o => o.orderId === orderId);
      
      if (!currentOrder) {
        alert('Order not found. Redirecting to order report...');
        window.location.href = 'order-report.html';
        return;
      }

      originalOrderData = JSON.parse(JSON.stringify(currentOrder));
      displayOrder();
    }

    // Display order in view mode
    function displayOrder() {
      document.getElementById('order-id-display').textContent = `Order: ${currentOrder.orderId}`;
      document.getElementById('order-no').value = currentOrder.orderId || '';
      document.getElementById('order-type').value = currentOrder.orderType || '';
      document.getElementById('customer-name').value = currentOrder.customerName || '';
      document.getElementById('delivery-date').value = currentOrder.deliveryDate || '';
      document.getElementById('total-order-value').textContent = `$${currentOrder.totalValue ? currentOrder.totalValue.toFixed(2) : '0.00'}`;

      // Design images are now per-item, so we don't need to load them here

      // Display items
      const container = document.getElementById('items-container');
      container.innerHTML = '';
      itemCounter = 0;

      if (currentOrder.items && currentOrder.items.length > 0) {
        currentOrder.items.forEach(item => {
          const itemForm = createItemForm(itemCounter++, item, false);
          container.appendChild(itemForm);
        });
      }

      updateOrderSummary();
    }


    // Helper functions
    function safeValue(val) {
      return val !== undefined && val !== null ? val : '';
    }
    
    function safeNumber(val) {
      return val !== undefined && val !== null ? val : '';
    }

    // Create item form (reused from order-creation with edit mode support)
    function createItemForm(itemIndex, defaults = {}, editable = false) {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'border border-border-light dark:border-border-dark rounded-lg p-6 bg-background-light dark:bg-background-dark';
      itemDiv.dataset.itemIndex = itemIndex;
      
      defaults = defaults || {};
      const readonlyClass = editable ? '' : 'bg-gray-100 dark:bg-gray-800 cursor-not-allowed';
      const readonlyAttr = editable ? '' : 'disabled';
      const deleteBtnStyle = editable ? '' : 'hidden';
      
      itemDiv.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-text-light dark:text-text-dark">Item ${itemIndex + 1}</h3>
          <button type="button" class="delete-item-btn text-red-500 hover:opacity-80 ${deleteBtnStyle}">
            <span class="material-icons">delete</span>
          </button>
        </div>

        <!-- Basic Item Information -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="col-span-1 md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Item Name <span class="text-red-500">*</span></label>
            <input type="text" class="item-name w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg ${editable ? 'bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary' : readonlyClass}" placeholder="e.g., Jasmine Necklace" value="${safeValue(defaults.name)}" ${editable ? 'required' : readonlyAttr}>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">SKU Reference ${editable ? '<span class="text-gray-400">(Optional)</span>' : ''}</label>
            <input type="text" class="item-sku w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg ${editable ? 'bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary' : readonlyClass}" placeholder="SKU-REF-001" value="${safeValue(defaults.sku)}" ${readonlyAttr}>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Quantity <span class="text-red-500">*</span></label>
            <input type="number" class="item-quantity w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg ${editable ? 'bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary' : readonlyClass}" min="1" value="${defaults.quantity || 1}" ${editable ? 'required' : readonlyAttr}>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Category</label>
            ${editable ? `
            <div class="flex items-center gap-2">
              <select class="item-category flex-1 px-4 py-2 border border-border-light dark:border-border-dark rounded-lg bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary">
                <option value="">Select Category</option>
                <option value="necklace" ${defaults.category === 'necklace' ? 'selected' : ''}>Necklace</option>
                <option value="ring" ${defaults.category === 'ring' ? 'selected' : ''}>Ring</option>
                <option value="earrings" ${defaults.category === 'earrings' ? 'selected' : ''}>Earrings</option>
                <option value="bracelet" ${defaults.category === 'bracelet' ? 'selected' : ''}>Bracelet</option>
              </select>
              <button type="button" class="add-category-btn flex-shrink-0 flex items-center justify-center h-10 w-10 rounded-lg bg-primary text-white hover:opacity-90 transition-opacity" title="Add New Category">
                <span class="material-icons text-base">add</span>
              </button>
            </div>
            ` : `
            <select class="item-category flex-1 px-4 py-2 border border-border-light dark:border-border-dark rounded-lg ${readonlyClass}" ${readonlyAttr}>
              <option value="">Select Category</option>
              <option value="necklace" ${defaults.category === 'necklace' ? 'selected' : ''}>Necklace</option>
              <option value="ring" ${defaults.category === 'ring' ? 'selected' : ''}>Ring</option>
              <option value="earrings" ${defaults.category === 'earrings' ? 'selected' : ''}>Earrings</option>
              <option value="bracelet" ${defaults.category === 'bracelet' ? 'selected' : ''}>Bracelet</option>
            </select>
            `}
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Sub Category</label>
            ${editable ? `
            <div class="flex items-center gap-2">
              <select class="item-subcategory flex-1 px-4 py-2 border border-border-light dark:border-border-dark rounded-lg bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary">
                <option value="">Select Sub Category</option>
                <option value="pendant" ${defaults.subcategory === 'pendant' ? 'selected' : ''}>Pendant</option>
                <option value="chain" ${defaults.subcategory === 'chain' ? 'selected' : ''}>Chain</option>
                <option value="choker" ${defaults.subcategory === 'choker' ? 'selected' : ''}>Choker</option>
              </select>
              <button type="button" class="add-subcategory-btn flex-shrink-0 flex items-center justify-center h-10 w-10 rounded-lg bg-primary text-white hover:opacity-90 transition-opacity" title="Add New Sub Category">
                <span class="material-icons text-base">add</span>
              </button>
            </div>
            ` : `
            <select class="item-subcategory flex-1 px-4 py-2 border border-border-light dark:border-border-dark rounded-lg ${readonlyClass}" ${readonlyAttr}>
              <option value="">Select Sub Category</option>
              <option value="pendant" ${defaults.subcategory === 'pendant' ? 'selected' : ''}>Pendant</option>
              <option value="chain" ${defaults.subcategory === 'chain' ? 'selected' : ''}>Chain</option>
              <option value="choker" ${defaults.subcategory === 'choker' ? 'selected' : ''}>Choker</option>
            </select>
            `}
          </div>
        </div>

        <!-- Metal Details -->
        <div class="border-t border-border-light dark:border-border-dark pt-6 mb-6">
          <div class="flex items-center justify-between mb-4">
            <h4 class="text-base font-semibold text-text-light dark:text-text-dark">Metal Details</h4>
            <button type="button" class="add-metal-btn flex items-center gap-2 text-sm font-semibold text-primary hover:opacity-80" style="${editable ? '' : 'display: none;'}">
              <span class="material-icons text-base">add_circle_outline</span>
              <span>Add Metal Details</span>
            </button>
          </div>
          <div class="metal-details-container space-y-4">
            <!-- Metal detail rows will be added here -->
          </div>
        </div>

        <!-- Diamond Details -->
        <div class="border-t border-border-light dark:border-border-dark pt-6 mb-6">
          <div class="flex items-center justify-between mb-4">
            <h4 class="text-base font-semibold text-text-light dark:text-text-dark">Diamond Details</h4>
            <button type="button" class="add-diamond-btn flex items-center gap-2 text-sm font-semibold text-primary hover:opacity-80" style="${editable ? '' : 'display: none;'}">
              <span class="material-icons text-base">add_circle_outline</span>
              <span>Add Diamond Details</span>
            </button>
          </div>
          <div class="diamond-details-container space-y-4">
            <!-- Diamond detail rows will be added here -->
          </div>
        </div>

        <!-- Stone Details -->
        <div class="border-t border-border-light dark:border-border-dark pt-6 mb-6">
          <div class="flex items-center justify-between mb-4">
            <h4 class="text-base font-semibold text-text-light dark:text-text-dark">Stone Details</h4>
            <button type="button" class="add-stone-btn flex items-center gap-2 text-sm font-semibold text-primary hover:opacity-80" style="${editable ? '' : 'display: none;'}">
              <span class="material-icons text-base">add_circle_outline</span>
              <span>Add Stone Details</span>
            </button>
          </div>
          <div class="stone-details-container space-y-4">
            <!-- Stone detail rows will be added here -->
          </div>
        </div>

        <!-- Remarks -->
        <div class="border-t border-border-light dark:border-border-dark pt-6 mb-6">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Remarks / Special Instructions</label>
          <textarea class="item-remarks w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg ${editable ? 'bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary' : readonlyClass}" rows="2" placeholder="Optional notes for the item..." ${readonlyAttr}>${safeValue(defaults.remarks)}</textarea>
        </div>

        <!-- Cost Details -->
        <div class="border-t border-border-light dark:border-border-dark pt-6">
          <h4 class="text-base font-semibold text-text-light dark:text-text-dark mb-4">Cost Details</h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Material Cost</label>
              <input type="text" class="item-material-cost w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg bg-gray-100 dark:bg-gray-800 cursor-not-allowed" placeholder="Auto-calculated" readonly value="${defaults.materialCost !== undefined && defaults.materialCost !== null ? parseFloat(defaults.materialCost).toFixed(2) : '0.00'}">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Making Charge <span class="text-gray-400">(Optional)</span></label>
              <input type="number" step="0.01" class="item-making-charge w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg ${editable ? 'bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary' : readonlyClass}" placeholder="e.g., 500.00" value="${safeNumber(defaults.makingCharge)}" ${readonlyAttr}>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Total Cost</label>
              <input type="text" class="item-total-cost w-full px-4 py-2 border border-border-light dark:border-border-dark rounded-lg bg-gray-100 dark:bg-gray-800 cursor-not-allowed" placeholder="Auto-calculated" readonly value="${defaults.totalCost !== undefined && defaults.totalCost !== null ? parseFloat(defaults.totalCost).toFixed(2) : '0.00'}">
            </div>
          </div>
        </div>

        <!-- Item Status and Design Images -->
        <div class="border-t border-border-light dark:border-border-dark pt-6">
          <div class="flex items-center justify-between mb-4">
            <h4 class="text-base font-semibold text-text-light dark:text-text-dark">Item Status & Design Images</h4>
            <div class="flex items-center gap-4">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Status:</label>
              <select class="item-status px-4 py-2 border border-border-light dark:border-border-dark rounded-lg ${readonlyClass} ${editable ? 'bg-background-light dark:bg-background-dark' : 'bg-gray-100 dark:bg-gray-800'}" ${readonlyAttr}>
                <option value="pending_approval" ${defaults.status === 'pending_approval' ? 'selected' : (!defaults.status ? 'selected' : '')}>Pending Approval</option>
                <option value="partially_approved" ${defaults.status === 'partially_approved' ? 'selected' : ''}>Partially Approved</option>
                <option value="completely_approved" ${defaults.status === 'completely_approved' ? 'selected' : ''}>Completely Approved</option>
              </select>
            </div>
          </div>

          <!-- Image Upload Area -->
          <div class="item-image-upload-section ${editable ? '' : 'hidden'} border-2 border-dashed border-border-light dark:border-border-dark rounded-lg p-4 text-center mb-4">
            <input type="file" class="item-design-image-input hidden" accept="image/*" multiple id="item-design-image-${itemIndex}">
            <label for="item-design-image-${itemIndex}" class="cursor-pointer block">
              <div class="flex flex-col items-center">
                <span class="material-icons text-3xl text-gray-400 mb-2">cloud_upload</span>
                <p class="text-sm text-gray-600 dark:text-gray-400 mb-1">Click to upload or drag and drop</p>
                <p class="text-xs text-gray-500 dark:text-gray-500">PNG, JPG, GIF up to 10MB</p>
              </div>
            </label>
          </div>

          <!-- Image Gallery -->
          <div class="item-design-images-gallery grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Images will be displayed here -->
          </div>
          <div class="item-no-images-message text-center py-4 text-gray-500 dark:text-gray-400">
            <span class="material-icons text-2xl mb-1">image</span>
            <p class="text-sm">No design images uploaded yet.</p>
          </div>
        </div>
      `;

      // Initialize item design images
      const itemDesignImages = defaults.designImages || [];
      itemDiv.dataset.designImages = JSON.stringify(itemDesignImages);
      displayItemDesignImages(itemDiv, itemDesignImages);

      if (editable) {
        const deleteBtn = itemDiv.querySelector('.delete-item-btn');
        if (deleteBtn) {
          deleteBtn.addEventListener('click', function() {
            if (confirm('Are you sure you want to remove this item?')) {
              itemDiv.remove();
              updateOrderSummary();
            }
          });
        }

        const makingChargeInput = itemDiv.querySelector('.item-making-charge');
        if (makingChargeInput) {
          makingChargeInput.addEventListener('input', function() {
            calculateItemCost(itemDiv);
          });
        }

        // Add diamond details button handler
        const addDiamondBtn = itemDiv.querySelector('.add-diamond-btn');
        if (addDiamondBtn) {
          addDiamondBtn.addEventListener('click', function() {
            addDiamondDetail(itemDiv);
          });
        }

        // Add stone details button handler
        const addStoneBtn = itemDiv.querySelector('.add-stone-btn');
        if (addStoneBtn) {
          addStoneBtn.addEventListener('click', function() {

        }

        // Add metal details button handler
        const addMetalBtn = itemDiv.querySelector('.add-metal-btn');
        if (addMetalBtn) {
          addMetalBtn.addEventListener('click', function() {
            addMetalDetail(itemDiv);
          });
        }

        // Setup image upload for this item
        setupItemImageUpload(itemDiv, itemIndex);
      }

      // Add default metals if provided
      if (defaults.metals && defaults.metals.length > 0) {
        defaults.metals.forEach(metal => {
          addMetalDetail(itemDiv, metal);
        });
      } else if (defaults.metal) {
        // Support legacy single metal format
        addMetalDetail(itemDiv, {
          metal: defaults.metal,
          metalWeight: defaults.metalWeight,
          metalColour: defaults.metalColour
        });
      }

      // Add default diamond and stone if provided
      if (defaults.diamonds && defaults.diamonds.length > 0) {
        defaults.diamonds.forEach(diamond => {
          addDiamondDetail(itemDiv, diamond);
        });
      }

      if (defaults.stones && defaults.stones.length > 0) {
        defaults.stones.forEach(stone => {
          addStoneDetail(itemDiv, stone);
        });
      }

      // Add summary update handlers
      const itemNameInput = itemDiv.querySelector('.item-name');
      const itemQuantityInput = itemDiv.querySelector('.item-quantity');
      
      if (itemNameInput) {
        itemNameInput.addEventListener('input', updateOrderSummary);
      }
      if (itemQuantityInput) {
        itemQuantityInput.addEventListener('input', updateOrderSummary);
      }

      // If defaults provided, calculate cost
      if (defaults.materialCost || defaults.makingCharge) {
        calculateItemCost(itemDiv);
      }

      return itemDiv;

    // Display design images for a specific item
    function displayItemDesignImages(itemDiv, images) {
      const gallery = itemDiv.querySelector('.item-design-images-gallery');
      const noImagesMsg = itemDiv.querySelector('.item-no-images-message');
      
      gallery.innerHTML = '';
      
      if (!images || images.length === 0) {
        noImagesMsg.classList.remove('hidden');
        gallery.classList.add('hidden');
      } else {
        noImagesMsg.classList.add('hidden');
        gallery.classList.remove('hidden');
        
        images.forEach((image, index) => {
          const imageDiv = document.createElement('div');
          imageDiv.className = 'relative group border border-border-light dark:border-border-dark rounded-lg overflow-hidden';
          
          imageDiv.innerHTML = `
            <img src="${image.dataUrl}" alt="Design ${index + 1}" class="w-full h-32 object-cover">
            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-50 transition-opacity flex items-center justify-center">
              ${isEditMode ? `
                <button type="button" class="delete-item-image-btn opacity-0 group-hover:opacity-100 text-white bg-red-500 hover:bg-red-600 px-3 py-1 rounded transition-opacity" data-index="${index}">
                  <span class="material-icons text-sm">delete</span>
                </button>
              ` : ''}
            </div>
            <div class="p-2 bg-background-light dark:bg-background-dark">
              <p class="text-xs text-gray-600 dark:text-gray-400 truncate">${image.fileName || `Design ${index + 1}`}</p>
            </div>
          `;
          
          gallery.appendChild(imageDiv);
        });
        
        // Add delete button handlers
        if (isEditMode) {
          gallery.querySelectorAll('.delete-item-image-btn').forEach(btn => {
            btn.addEventListener('click', function() {
              const index = parseInt(this.dataset.index);
              if (confirm('Are you sure you want to remove this image?')) {
                let currentImages = JSON.parse(itemDiv.dataset.designImages || '[]');
                currentImages.splice(index, 1);
                itemDiv.dataset.designImages = JSON.stringify(currentImages);
                displayItemDesignImages(itemDiv, currentImages);
              }
            });
          });
        }
      }

    // Get design images for an item
    function getItemDesignImages(itemDiv) {
      // Get from data attribute if available, otherwise from gallery
      if (itemDiv.dataset.designImages) {
        return JSON.parse(itemDiv.dataset.designImages);
      }
      
      const gallery = itemDiv.querySelector('.item-design-images-gallery');
      if (!gallery) return [];
      
      const images = [];
      gallery.querySelectorAll('img').forEach(img => {
        const parentDiv = img.closest('.relative');
        if (parentDiv) {
          const fileNameEl = parentDiv.querySelector('.text-xs');
          const fileName = fileNameEl ? fileNameEl.textContent : `Design ${images.length + 1}`;
          images.push({
            fileName: fileName,
            dataUrl: img.src
          });
        }
      });
      return images;
    }

    // Setup image upload for an item
    function setupItemImageUpload(itemDiv, itemIndex) {
      const uploadSection = itemDiv.querySelector('.item-image-upload-section');
      const fileInput = itemDiv.querySelector('.item-design-image-input');
      
      if (!fileInput || !uploadSection) {
        console.error('Image upload elements not found for item', itemIndex);
        return;
      }

      // Ensure the file input has the correct ID
      if (!fileInput.id) {
        fileInput.id = `item-design-image-${itemIndex}`;
      }
      
      // Ensure label has correct for attribute
      const label = uploadSection.querySelector('label');
      if (label && fileInput.id) {
        label.setAttribute('for', fileInput.id);
      }

      // Remove any existing event listeners by cloning
      const newFileInput = fileInput.cloneNode(true);
      fileInput.parentNode.replaceChild(newFileInput, fileInput);

      // File input change handler
      newFileInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
          handleItemImageFiles(itemDiv, files);
        }
        this.value = '';
      });

      // Drag and drop handlers
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        uploadSection.addEventListener(eventName, preventDefaults, false);
      });

      ['dragenter', 'dragover'].forEach(eventName => {
        uploadSection.addEventListener(eventName, () => {
          uploadSection.classList.add('border-primary', 'bg-primary/5');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        uploadSection.addEventListener(eventName, () => {
          uploadSection.classList.remove('border-primary', 'bg-primary/5');
        }, false);
      });

      uploadSection.addEventListener('drop', function(e) {
        const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
        handleItemImageFiles(itemDiv, files);
      });
    }

    // Handle image files for an item
    function handleItemImageFiles(itemDiv, files) {
      files.forEach(file => {
        if (!file.type.startsWith('image/')) {
          alert(`${file.name} is not an image file.`);
          return;
        }
        
        if (file.size > 10 * 1024 * 1024) {
          alert(`${file.name} exceeds 10MB. Please choose a smaller file.`);
          return;
        }
        
        const reader = new FileReader();
        reader.onload = function(event) {
          // Store images in a data attribute for persistence
          let currentImages = JSON.parse(itemDiv.dataset.designImages || '[]');
          currentImages.push({
            fileName: file.name,
            dataUrl: event.target.result,
            uploadedAt: new Date().toISOString()
          });
          itemDiv.dataset.designImages = JSON.stringify(currentImages);
          displayItemDesignImages(itemDiv, currentImages);
        };
        reader.readAsDataURL(file);
      });
    }

    // Calculate item cost
    function calculateItemCost(itemDiv) {
      const materialCost = parseFloat(itemDiv.querySelector('.item-material-cost').value.replace(/[^0-9.]/g, '')) || 0;
      const makingCharge = parseFloat(itemDiv.querySelector('.item-making-charge').value) || 0;
      const totalCost = materialCost + makingCharge;
      
      itemDiv.querySelector('.item-total-cost').value = totalCost.toFixed(2);
      updateOrderSummary();
    }

    // Helper function to format currency
    function formatCurrency(value) {
      return parseFloat(value || 0).toFixed(2);
    }

    // Helper function to create a table cell
    function createCell(content, className = '', align = 'left', isHTML = false) {
      const td = document.createElement('td');
      td.className = `px-3 py-2 border border-border-light dark:border-border-dark ${className}`;
      td.style.textAlign = align;
      if (isHTML) {
        td.innerHTML = content;
      } else {
        td.textContent = content;
      }
      return td;
    }

      });

      // Show delete buttons
      document.querySelectorAll('.delete-item-btn').forEach(btn => {
        btn.classList.remove('hidden');
      });
      
      // Show image upload sections for all items
      document.querySelectorAll('.item-image-upload-section').forEach(section => {
        section.classList.remove('hidden');
      });
      
      // Show add buttons for metal, diamond, and stone
      document.querySelectorAll('.add-metal-btn, .add-diamond-btn, .add-stone-btn').forEach(btn => {
        btn.style.display = 'flex';
      });
      
      // Enable delete buttons in metal, diamond, and stone rows
      document.querySelectorAll('.delete-metal-btn, .delete-diamond-btn, .delete-stone-btn').forEach(btn => {
        btn.classList.remove('hidden');
        btn.disabled = false;
      });
      
      // Enable inputs in metal, diamond, and stone rows
      document.querySelectorAll('.metal-detail-row input, .metal-detail-row select, .diamond-detail-row input, .diamond-detail-row select, .stone-detail-row input, .stone-detail-row select').forEach(input => {
        if (!input.readOnly) {
          input.disabled = false;
          input.classList.remove('bg-gray-100', 'dark:bg-gray-800', 'cursor-not-allowed');
          input.classList.add('bg-background-light', 'dark:bg-background-dark');
        }
      });
      
      // Refresh image displays to show delete buttons and show upload sections
      document.querySelectorAll('#items-container > div').forEach((itemDiv, index) => {
        const images = getItemDesignImages(itemDiv);
        displayItemDesignImages(itemDiv, images);
        const uploadSection = itemDiv.querySelector('.item-image-upload-section');
        if (uploadSection) {
          uploadSection.classList.remove('hidden');
        }
        // Setup image upload for existing items when entering edit mode
        setupItemImageUpload(itemDiv, index);
        
        // Attach event handlers for add buttons if not already attached
        const addMetalBtn = itemDiv.querySelector('.add-metal-btn');
        if (addMetalBtn && !addMetalBtn.dataset.handlerAttached) {
          addMetalBtn.addEventListener('click', function() {
            addMetalDetail(itemDiv);
          });
          addMetalBtn.dataset.handlerAttached = 'true';
        }
        
        const addDiamondBtn = itemDiv.querySelector('.add-diamond-btn');
        if (addDiamondBtn && !addDiamondBtn.dataset.handlerAttached) {
          addDiamondBtn.addEventListener('click', function() {
            addDiamondDetail(itemDiv);
          });
          addDiamondBtn.dataset.handlerAttached = 'true';
        }
        
        const addStoneBtn = itemDiv.querySelector('.add-stone-btn');
        if (addStoneBtn && !addStoneBtn.dataset.handlerAttached) {
          addStoneBtn.addEventListener('click', function() {
            addStoneDetail(itemDiv);
          });
          addStoneBtn.dataset.handlerAttached = 'true';
        }
      });
    }

    // Disable edit mode
    function disableEditMode() {
      isEditMode = false;
      document.getElementById('edit-order-btn').classList.remove('hidden');
      document.getElementById('save-order-btn').classList.add('hidden');
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      document.getElementById('add-item-btn').classList.add('hidden');

      // Reload original data
      currentOrder = JSON.parse(JSON.stringify(originalOrderData));
      displayOrder();
    }

    // Save order
    function saveOrder() {
      const orderType = document.getElementById('order-type').value;
      const customerName = document.getElementById('customer-name').value;
      const items = document.querySelectorAll('#items-container > div');

      if (!orderType || !customerName) {
        alert('Please fill in Order Type and Customer Name.');
        return;
      }

      // Collect order data
      const orderData = {
        orderId: document.getElementById('order-no').value,
        orderType: orderType,
        customerName: customerName,
        deliveryDate: document.getElementById('delivery-date').value,
        items: [],
        totalValue: parseFloat(document.getElementById('total-order-value').textContent.replace(/[^0-9.]/g, '')) || 0,
        createdAt: currentOrder.createdAt,
        updatedAt: new Date().toISOString()
      };

      items.forEach(itemDiv => {
        const materialCost = parseFloat(itemDiv.querySelector('.item-material-cost').value.replace(/[^0-9.]/g, '')) || 0;
        
        // Collect multiple metals
        const metalRows = itemDiv.querySelectorAll('.metal-detail-row');
        const metals = [];
        metalRows.forEach(metalDiv => {
          metals.push({
            metal: metalDiv.querySelector('.metal-type').value,
            metalWeight: parseFloat(metalDiv.querySelector('.metal-weight').value) || 0,
            metalColour: metalDiv.querySelector('.metal-colour').value
          });
        });
        
        // Collect diamonds
        const diamondRows = itemDiv.querySelectorAll('.diamond-detail-row');
        const diamonds = [];
        diamondRows.forEach(diamondDiv => {
          diamonds.push({
            diamond_master_id: diamondDiv.querySelector('.diamond-master-id').value || null,
            shape: diamondDiv.querySelector('.diamond-shape').value || null,
            size: diamondDiv.querySelector('.diamond-size').value || null,
            clarity: diamondDiv.querySelector('.diamond-clarity').value || null,
            cut: diamondDiv.querySelector('.diamond-cut').value || null,
            certification: diamondDiv.querySelector('.diamond-certification').value || null,
            pieces: diamondDiv.querySelector('.diamond-pieces').value ? parseInt(diamondDiv.querySelector('.diamond-pieces').value) : null,
            total_carat: diamondDiv.querySelector('.diamond-total-carat').value ? parseFloat(diamondDiv.querySelector('.diamond-total-carat').value) : null,
            rate_per_carat: diamondDiv.querySelector('.diamond-rate-per-carat').value ? parseFloat(diamondDiv.querySelector('.diamond-rate-per-carat').value) : null,
            total_value: diamondDiv.querySelector('.diamond-total-value').value ? parseFloat(diamondDiv.querySelector('.diamond-total-value').value) : null
          });
        });
        
        // Collect stones
        const stoneRows = itemDiv.querySelectorAll('.stone-detail-row');
        const stones = [];
        stoneRows.forEach(stoneDiv => {
          stones.push({
            stone_master_id: stoneDiv.querySelector('.stone-master-id').value || null,
            stone_type_id: stoneDiv.querySelector('.stone-type-id').value || null,
            shape_id: stoneDiv.querySelector('.stone-shape-id').value || null,
            size_id: stoneDiv.querySelector('.stone-size-id').value || null,
            colour_id: stoneDiv.querySelector('.stone-colour-id').value || null,
            quality_id: stoneDiv.querySelector('.stone-quality-id').value || null,
            pcs: stoneDiv.querySelector('.stone-pcs').value ? parseInt(stoneDiv.querySelector('.stone-pcs').value) : null,
            total_carat: stoneDiv.querySelector('.stone-total-carat').value ? parseFloat(stoneDiv.querySelector('.stone-total-carat').value) : null,
            rate_per_carat: stoneDiv.querySelector('.stone-rate-per-carat').value ? parseFloat(stoneDiv.querySelector('.stone-rate-per-carat').value) : null,
            total_value: stoneDiv.querySelector('.stone-total-value').value ? parseFloat(stoneDiv.querySelector('.stone-total-value').value) : null
          });
        });
        
        const item = {
          name: itemDiv.querySelector('.item-name').value,
          sku: itemDiv.querySelector('.item-sku').value,
          quantity: parseInt(itemDiv.querySelector('.item-quantity').value) || 1,
          category: itemDiv.querySelector('.item-category').value,
          subcategory: itemDiv.querySelector('.item-subcategory').value,
          metals: metals,
          diamonds: diamonds,
          stones: stones,
          materialCost: materialCost,
          makingCharge: parseFloat(itemDiv.querySelector('.item-making-charge').value) || 0,
          totalCost: parseFloat(itemDiv.querySelector('.item-total-cost').value) || 0,
          remarks: itemDiv.querySelector('.item-remarks') ? itemDiv.querySelector('.item-remarks').value : '',
          status: itemDiv.querySelector('.item-status').value || 'pending_approval',
          designImages: getItemDesignImages(itemDiv)
        };
        orderData.items.push(item);
      });

      // Update in localStorage
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const orderIndex = orders.findIndex(o => o.orderId === orderData.orderId);
      if (orderIndex !== -1) {
        orders[orderIndex] = orderData;
        localStorage.setItem('orders', JSON.stringify(orders));
        alert('Order updated successfully!');
        
        // Update current order and original
        currentOrder = orderData;
        originalOrderData = JSON.parse(JSON.stringify(orderData));
        disableEditMode();
      }
    }

    // Prevent defaults for drag and drop
    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    // Delete order function
    function deleteOrder() {
      const orderId = getOrderIdFromURL();
      if (!orderId) {
        alert('Order ID not found.');
        return;
      }

      if (!confirm('Are you sure you want to delete this order? This action cannot be undone.')) {
        return;
      }

      // Remove from localStorage
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const orderIndex = orders.findIndex(o => o.orderId === orderId);
      
      if (orderIndex !== -1) {
        orders.splice(orderIndex, 1);
        localStorage.setItem('orders', JSON.stringify(orders));
        alert('Order deleted successfully!');
        window.location.href = 'order-report.html';
      } else {
        alert('Order not found.');
      }
    }

    // Event listeners
    document.getElementById('edit-order-btn').addEventListener('click', enableEditMode);
    document.getElementById('save-order-btn').addEventListener('click', saveOrder);
    document.getElementById('cancel-edit-btn').addEventListener('click', disableEditMode);
    document.getElementById('delete-order-btn').addEventListener('click', deleteOrder);
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = 'order-report.html';
    });

    document.getElementById('add-item-btn').addEventListener('click', function() {
      const container = document.getElementById('items-container');
      const itemForm = createItemForm(itemCounter++, {}, true);
      container.appendChild(itemForm);
      updateOrderSummary();
    });

    // Initialize
    loadOrder();
  </script>
</body>
</html>
