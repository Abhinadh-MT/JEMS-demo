<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Demo — Page 2</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#d4af37",
            "background-light": "#f5f5f5",
            "background-dark": "#121212",
            "card-light": "#ffffff",
            "card-dark": "#1e1e1e",
            "text-light": "#333333",
            "text-dark": "#e0e0e0",
            "border-light": "#e0e0e0",
            "border-dark": "#333333",
          },
          fontFamily: { display: ["Poppins", "sans-serif"] },
          borderRadius: { DEFAULT: "0.5rem" },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="page2" class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark flex h-screen">
  <div class="flex min-h-screen w-full">
    <div id="menu-container"></div>

    <main class="flex-1 overflow-y-auto p-8 bg-background-light dark:bg-background-dark">
      <h1 class="text-3xl font-bold mb-4">Page 2</h1>
      <p class="text-gray-600 dark:text-gray-400">Content for Page 2.</p>
    </main>
  </div>

  <script src="menu.js"></script>
</body>
</html>
