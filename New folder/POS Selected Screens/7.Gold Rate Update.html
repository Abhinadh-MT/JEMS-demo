<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JEMS Manual Metal Rate Update</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c8a95f",
                        "background-light": "#f8f7f6",
                        "background-dark": "#1e1b14",
                    },
                    fontFamily: {
                        "display": ["Noto Serif", "serif"],
                        "sans": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Noto Sans', sans-serif;
        }
        .font-display {
            font-family: 'Noto Serif', serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-stone-200 dark:bg-stone-900 min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- Modal Container -->
<div class="relative flex h-full sm:h-auto min-h-[100dvh] sm:min-h-0 w-full max-w-md flex-col bg-background-light dark:bg-background-dark sm:rounded-xl shadow-2xl overflow-hidden group/design-root">
<!-- Title Bar / TopAppBar -->
<div class="flex items-center bg-primary p-4 justify-between">
<div class="text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">close</span>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center font-display uppercase tracking-wider">
                Daily Metal Rates
            </h2>
<div class="flex size-10 items-center justify-end">
<button class="flex items-center justify-center text-white">
<span class="material-symbols-outlined">history</span>
</button>
</div>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto pb-32">
<!-- Header Info -->
<div class="bg-primary/10 dark:bg-primary/5 px-4 py-3 border-b border-primary/20">
<div class="flex items-center gap-2 text-stone-700 dark:text-stone-300">
<span class="material-symbols-outlined text-sm">update</span>
<p class="text-xs font-medium uppercase tracking-widest">Last Updated: 24-May-2024 09:30 AM</p>
</div>
</div>
<!-- Input Grid -->
<div class="p-4 space-y-6">
<!-- 24K Gold -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="flex flex-col">
<span class="text-stone-900 dark:text-stone-100 font-display text-lg font-bold">24K Gold</span>
<span class="text-stone-500 dark:text-stone-400 text-xs italic">Previous: ₹7,250 / gram</span>
</label>
<span class="text-primary font-bold text-xs">PRICE PER GRAM</span>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="text-stone-400 font-medium">₹</span>
</div>
<input class="block w-full pl-8 pr-12 py-4 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary text-xl font-bold text-stone-900 dark:text-stone-100 transition-all" placeholder="7,310" type="number"/>
</div>
</div>
<!-- 22K Gold -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="flex flex-col">
<span class="text-stone-900 dark:text-stone-100 font-display text-lg font-bold">22K Gold</span>
<span class="text-stone-500 dark:text-stone-400 text-xs italic">Previous: ₹6,650 / gram</span>
</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="text-stone-400 font-medium">₹</span>
</div>
<input class="block w-full pl-8 pr-12 py-4 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary text-xl font-bold text-stone-900 dark:text-stone-100 transition-all" placeholder="6,700" type="number"/>
</div>
</div>
<!-- 18K Gold -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="flex flex-col">
<span class="text-stone-900 dark:text-stone-100 font-display text-lg font-bold">18K Gold</span>
<span class="text-stone-500 dark:text-stone-400 text-xs italic">Previous: ₹5,440 / gram</span>
</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="text-stone-400 font-medium">₹</span>
</div>
<input class="block w-full pl-8 pr-12 py-4 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary text-xl font-bold text-stone-900 dark:text-stone-100 transition-all" placeholder="5,510" type="number"/>
</div>
</div>
<!-- Silver -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="flex flex-col">
<span class="text-stone-900 dark:text-stone-100 font-display text-lg font-bold">Silver</span>
<span class="text-stone-500 dark:text-stone-400 text-xs italic">Previous: ₹92.00 / gram</span>
</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="text-stone-400 font-medium">₹</span>
</div>
<input class="block w-full pl-8 pr-12 py-4 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary text-xl font-bold text-stone-900 dark:text-stone-100 transition-all" placeholder="94.50" type="number"/>
</div>
</div>
<hr class="border-stone-200 dark:border-stone-800 my-2"/>
<!-- Board Update Toggle -->
<div class="flex items-center justify-between bg-white dark:bg-stone-800 p-4 rounded-xl border border-primary/20 shadow-sm">
<div class="flex items-center gap-3">
<div class="bg-primary/20 p-2 rounded-lg text-primary">
<span class="material-symbols-outlined">tv</span>
</div>
<div>
<p class="text-stone-900 dark:text-stone-100 font-bold text-sm">Board Update</p>
<p class="text-stone-500 dark:text-stone-400 text-[10px] uppercase">Push rates to customer display</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer dark:bg-stone-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
</div>
<!-- Action Footer -->
<div class="absolute bottom-0 left-0 right-0 p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-stone-200 dark:border-stone-800 flex gap-3">
<button class="flex-1 px-4 py-4 rounded-lg border border-stone-300 dark:border-stone-600 text-stone-700 dark:text-stone-300 font-bold text-sm uppercase tracking-wider hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">
                Cancel
            </button>
<button class="flex-[2] px-4 py-4 rounded-lg bg-primary text-white font-bold text-sm uppercase tracking-widest shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">check_circle</span>
                Update &amp; Apply
            </button>
</div>
</div>
</body></html>
